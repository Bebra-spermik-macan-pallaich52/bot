x-worker: &worker
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 45s
  read_only: true
  tmpfs:
    - /tmp:size=32m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  collector:
    <<: *worker
    command: ["python", "-u", "collector.py"]
    environment: &market_env
      PGHOST: db
      PGDATABASE: market
      PGUSER: market
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SYMBOL: ${SYMBOL:-BTCUSDT}
      CATEGORY: ${CATEGORY:-linear}
    healthcheck:
      test: ["CMD", "python", "health.py"]
      interval: 60s
      timeout: 15s
      start_period: 180s
      retries: 3
  backfill:
    <<: *worker
    command: ["python", "-u", "backfill.py"]
    environment:
      <<: *market_env
      BACKFILL_DAYS: ${BACKFILL_DAYS:-30}
    volumes:
      - ingestion_state:/app/state
    healthcheck:
      test: ["CMD", "python", "health.py", "backfill"]
      interval: 60s
      timeout: 15s
      start_period: 180s
      retries: 3
  analyst:
    <<: *worker
    command: ["python", "-u", "analysis.py"]
    environment:
      <<: *market_env
      MIN_EVENTS: ${MIN_EVENTS:-30}
      TEST_START_MS: ${TEST_START_MS:-}
      COST_BPS: ${COST_BPS:-10}
    volumes:
      - reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "health.py", "analyst"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
  dashboard:
    <<: *worker
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "--threads", "2", "--timeout", "30", "--access-logfile", "-", "--error-logfile", "-", "dashboard:application"]
    environment:
      <<: *market_env
      BACKFILL_DAYS: ${BACKFILL_DAYS:-30}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - reports:/app/reports:ro
      - ingestion_state:/app/state:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
  reports:
  ingestion_state:
